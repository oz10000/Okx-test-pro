name: OKX Sandbox CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Número de ciclos de trading a ejecutar'
        required: false
        default: '2'
        type: number

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Crear directorio de logs
      run: mkdir -p logs

    - name: Ejecutar pruebas
      env:
        OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
        OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
        OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        CI: true
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Ejecutar bot en sandbox (CI mode)
      if: always()
      env:
        OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
        OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
        OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        MAX_CYCLES: ${{ github.event.inputs.cycles || 2 }}
        CI: true
      run: |
        python runner/main.py

    - name: Subir logs como artefacto
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: okx-bot-logs
        path: logs/
        retention-days: 7
