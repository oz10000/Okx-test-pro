name: OKX Sandbox CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Número de ciclos del bot"
        required: false
        default: "2"

jobs:
  test:
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO: "True"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: |
            .pytest_cache
            logs/
          retention-days: 7

  bot-run:
    runs-on: ubuntu-latest
    environment: sandbox
    needs: test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OKX bot (sandbox cycles)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO: "True"
          CI_MODE: "1"
          MAX_CYCLES: ${{ github.event.inputs.cycles || '2' }}
        run: |
          python main.py

      - name: Upload bot runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-bot-logs
          path: |
            logs/
            audit/
          retention-days: 7
